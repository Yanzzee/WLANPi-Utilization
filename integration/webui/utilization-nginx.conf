    # BEGIN Utilization managed web route
    # All paths, including assets and downloads, use the existing session check.
    location = /utilization {
        return 308 /utilization/$is_args$args;
    }
    location ^~ /utilization/api/ {
        auth_request /auth/check;
        error_page 401 = @utilization_auth_required;
        include /etc/wlanpi-beacon-live/web-proxy.headers;
        proxy_pass http://unix:/run/wlanpi-utilization-web/web.sock;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 16k;
    }
    location ^~ /utilization/ {
        auth_request /auth/check;
        include /etc/wlanpi-beacon-live/web-proxy.headers;
        proxy_pass http://unix:/run/wlanpi-utilization-web/web.sock;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 16k;
    }
    location @utilization_auth_required {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"Sign in to WLAN Pi to continue","login_url":"/login"}';
    }
    # END Utilization managed web route
