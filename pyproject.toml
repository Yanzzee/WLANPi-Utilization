[build-system]
requires = ["setuptools>=75.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-beacon-live"
version = "0.1.0"
description = "CLI tools for replaying WLAN beacon QBSS channel utilization samples."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "WLANPi Beacon Live contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9"
]

[project.scripts]
beacon-live = "beacon_live.cli:main"
wlanpi-beacon-live = "beacon_live.device:main"

[tool.setuptools.packages.find]
include = ["beacon_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
