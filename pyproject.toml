[build-system]
requires = ["setuptools>=75.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-beacon-live"
version = "2.1.0"
description = "Utilization live WLAN metrics and beacon replay tools."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "WLANPi Beacon Live contributors" }
]
dependencies = []

[project.optional-dependencies]
core = ["websockets==15.0.1"]
web = ["Flask>=3.1.3,<4", "waitress>=3.0.2,<4"]
dev = [
  "pytest>=8.3.5,<9"
]

[project.scripts]
wlanpi-utilization = "beacon_live.device:main"
utilization = "beacon_live.cli:main"
beacon-live = "beacon_live.cli:main"
wlanpi-beacon-live = "beacon_live.device:main"

[tool.setuptools.packages.find]
include = ["beacon_live*"]

[tool.setuptools.package-data]
beacon_live = ["templates/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
